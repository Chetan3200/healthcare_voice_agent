name: fracture-clinic

services:
  db:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fracture_clinic}
      POSTGRES_USER: ${POSTGRES_USER:-clinic_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python setup_env.py first}
    command: ["postgres", "-c", "timezone=UTC"]
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - clinic_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  clinic_db_data:
