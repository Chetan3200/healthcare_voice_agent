[project]
name = "healthcare-voice-agent"
version = "0.1.0"
description = "A reproducible synthetic fracture-clinic voice-assistant project"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "sqlalchemy>=2.0,<3",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
voice = [
    "pipecat-ai[openai,runner,webrtc]==1.11.0",
    "openai==3.16.2",
]

# Add alongside --extra voice. Local Whisper uses MLX on Apple Silicon;
# Kokoro uses ONNX Runtime on CPU, leaving the GPU available for ASR.
local-voice = [
    "pipecat-ai[kokoro]==1.11.0",
    "kokoro-onnx==0.6.1",
    "mlx-whisper==0.4.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
healthcare-voice-agent = "healthcare_voice_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/healthcare_voice_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
