name: fracture-frontdesk-demo

services:
  db:
    image: pgvector/pgvector:0.8.6-pg16
    pull_policy: never
    environment:
      POSTGRES_DB: frontdesk_synthetic_demo
      POSTGRES_USER: frontdesk_demo_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/demo_db_password
    command: ["postgres", "-c", "timezone=UTC"]
    ports:
      - "127.0.0.1:55432:5432"
    secrets:
      - demo_db_password
    volumes:
      - frontdesk_demo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frontdesk_demo_owner -d frontdesk_synthetic_demo"]
      interval: 2s
      timeout: 3s
      retries: 45
      start_period: 5s

secrets:
  demo_db_password:
    file: ${FRONTDESK_DEMO_PASSWORD_FILE:?Use scripts/setup_frontdesk_demo.py --prepare}

volumes:
  frontdesk_demo_data:
